name: RealisticSeasons
main: com.realisticseasons.RealisticSeasonsPlugin
version: 1.0.0
api-version: 1.16
author: RealisticSeasons
description: Лёгкие сезоны без влияния на игрока и без изменения скорости тиков сервера. Только визуал и рост растений.

commands:
  season:
    description: Управление сезонами
    aliases: [seasons]
    usage: /<command> [info|set|next|reload]
    permission: seasons.use

permissions:
  seasons.use:
    description: Доступ к базовым командам сезона (info)
    default: true
  seasons.admin:
    description: Доступ к изменению сезонов (set, next, reload)
    default: op
