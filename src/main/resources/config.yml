# =========================================================
#  RealisticSeasons - конфиг
#  Плагин НЕ влияет на игрока (нет холода/жары) и НЕ трогает
#  скорость серверных тиков. Только визуал и рост растений.
# =========================================================

# Список миров, в которых работают сезоны. "all" - применить ко всем мирам.
worlds:
  - "world"

# Сколько игровых "дней" длится один сезон (см. ticks-per-day ниже)
season-length-days: 8

# Сколько тиков считается за один "день" смены сезона.
# 24000 тиков = 1 полный игровой день Minecraft при обычной скорости тиков.
# Это НЕ меняет скорость тиков сервера, а просто период таймера подсчёта дня.
ticks-per-day: 24000

# Стартовый сезон для миров, у которых ещё нет сохранённых данных.
# Варианты: SPRING, SUMMER, AUTUMN, WINTER
default-season: SPRING

# Рассылать ли сообщение/тайтл игрокам при смене сезона
broadcast-season-change: true

growth:
  # Шанс (0.0 - 1.0), что растение всё же немного вырастет, даже если сейчас не его сезон.
  # 0.0 = вне сезона рост полностью остановлен
  # 1.0 = сезон вообще не влияет на рост
  off-season-chance: 0.15

  # То же самое, но для роста деревьев из саженцев (StructureGrowEvent)
  trees-off-season-chance: 0.25

  # Для каждого типа блока указываем список сезонов, в которые он растёт нормально (100%).
  # Во все остальные сезоны применяется off-season-chance.
  # Названия блоков - как в Material (Bukkit API 1.16.5).
  crops:
    WHEAT: [SPRING, SUMMER]
    CARROTS: [SPRING, SUMMER, AUTUMN]
    POTATOES: [SPRING, SUMMER, AUTUMN]
    BEETROOTS: [SPRING, SUMMER]
    PUMPKIN_STEM: [SUMMER, AUTUMN]
    MELON_STEM: [SUMMER]
    COCOA: [SUMMER, AUTUMN]
    SUGAR_CANE: [SPRING, SUMMER, AUTUMN]
    BAMBOO_SAPLING: [SPRING, SUMMER, AUTUMN]
    BAMBOO: [SPRING, SUMMER, AUTUMN]
    CACTUS: [SPRING, SUMMER, AUTUMN]
    KELP: [SPRING, SUMMER, AUTUMN, WINTER]
    NETHER_WART: [SPRING, SUMMER, AUTUMN, WINTER]
    SWEET_BERRY_BUSH: [SPRING, SUMMER, AUTUMN]

visual:
  enabled: true
  # Раз в сколько тиков пытаться показать частицы (40 = 2 секунды)
  interval-ticks: 40
  # Шанс на срабатывание для каждого игрока за одну попытку
  chance: 0.35
  # Блок, чью "падающую пыль" использовать как частицу снега зимой
  winter-particle-block: SNOW
  # Блок, чью "падающую пыль" использовать как частицу листьев осенью
  autumn-particle-block: OAK_LEAVES

# Реальный снег на земле и лёд на воде зимой (не только частицы).
# ВАЖНО: больше нет радиуса вокруг игрока. Эффект работает по ВСЕМ
# загруженным чанкам мира (как обычные ванильные осадки) - снег
# постепенно накапливается слоями зимой и так же постепенно тает,
# когда сезон становится тёплым. Каждый запуск задачи случайным
# образом перемешивает чанки и берёт случайные колонки в них, поэтому
# результат не привязан к одной стороне света и не повторяется одним
# и тем же паттерном.
ground-effects:
  enabled: true
  # Раз в сколько тиков обрабатывать загруженные чанки (100 = 5 секунд)
  interval-ticks: 100
  # Максимум блоков, которые можно изменить за один запуск задачи
  # (ограничивает нагрузку на сервер за один тик, чем меньше, тем мягче
  # для TPS, но тем медленнее накапливается/тает снег)
  blocks-per-run: 150
  # Превращать ли открытую воду в лёд зимой
  freeze-water: true
  # На каких блоках зимой появляется слой снега сверху
  snow-surfaces:
    - GRASS_BLOCK
    - DIRT
    - COARSE_DIRT
    - PODZOL
    - STONE
    - SAND
    - GRAVEL
    - MYCELIUM
